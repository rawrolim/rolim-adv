services:
  db:
    image: mysql:8.4
    restart: always
    container_name: database_rolim_adv_dev
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: yes
      MYSQL_DATABASE: mnradv76_mnr
    volumes:
      - ./database/initdb:/docker-entrypoint-initdb.d